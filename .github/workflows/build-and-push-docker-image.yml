name: Build and Push Docker Images

on:
    push:
        branches:
            - main
        paths:
            - "patch/**"
            - "Dockerfile"
            - ".github/workflows/build-and-push-docker-image.yml"
    workflow_dispatch:

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            # 登录到 GHCR
            - name: Log in to GitHub Container Registry (GHCR)
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # 登录到阿里云 ACR
            - name: Log in to ACR
              uses: docker/login-action@v4
              with:
                  registry: ${{ secrets.ALIYUN_REGISTRY }}
                  username: ${{ secrets.ALIYUN_REGISTRY_USER }}
                  password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

            # 获取当前日期 (yyyy-MM-dd) 并强制用户名小写
            - name: Prepare Image Tags
              id: prep
              run: |
                  OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
                  DATE=$(date +'%Y-%m-%d')
                  echo "owner=$OWNER" >> $GITHUB_OUTPUT
                  echo "date=$DATE" >> $GITHUB_OUTPUT

            # ---------------------------------------------------
            # 1. 优先构建 Base 阶段
            # ---------------------------------------------------
            - name: Build and push Base image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  target: base
                  provenance: false
                  tags: |
                      ghcr.io/${{ steps.prep.outputs.owner }}/warfork:${{ steps.prep.outputs.date }}
                      ghcr.io/${{ steps.prep.outputs.owner }}/warfork:latest
                      ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/warfork:${{ steps.prep.outputs.date }}
                      ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/warfork:latest

                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # ---------------------------------------------------
            # 2. 构建 DM 模式
            # ---------------------------------------------------
            - name: Build and push DM image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  target: dm
                  provenance: false
                  tags: |
                      ghcr.io/${{ steps.prep.outputs.owner }}/warfork:dm-${{ steps.prep.outputs.date }}
                      ghcr.io/${{ steps.prep.outputs.owner }}/warfork:dm-latest
                      ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/warfork:dm-${{ steps.prep.outputs.date }}
                      ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/warfork:dm-latest
                  cache-from: type=gha

            # ---------------------------------------------------
            # 3. 构建 Dual 模式
            # ---------------------------------------------------
            - name: Build and push Dual image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  target: dual
                  provenance: false
                  tags: |
                      ghcr.io/${{ steps.prep.outputs.owner }}/warfork:dual-${{ steps.prep.outputs.date }}
                      ghcr.io/${{ steps.prep.outputs.owner }}/warfork:dual-latest
                      ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/warfork:dual-${{ steps.prep.outputs.date }}
                      ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/warfork:dual-latest
                  cache-from: type=gha
